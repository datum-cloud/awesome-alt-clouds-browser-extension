name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: datum-cloud/actions/.github/workflows/ci-basic.yaml@v1.26.0
    with:
      run: |
        for f in $(git ls-files "*.json"); do jq empty "$f"; done
        for f in $(git ls-files "*.js"); do node --check "$f"; done
